      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      html { background: #fbf3e9; }
      body { margin: 0; }
      #root { min-height: 100vh; }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fbf3e9;
        color: #c2113a;
        font: 500 12px/1 'Space Grotesk', system-ui, sans-serif;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Hibba is turning 19</div></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // If the app never mounts (module blocked, server gone), do not leave the
      // boot line sitting there forever with no explanation.
      window.setTimeout(function () {
        var boot = document.querySelector('.boot')
        if (!boot) return
        boot.innerHTML =
          '<span>This page could not start. Reload once the local server is running.</span>' +
          '<button type="button" style="margin-top:16px;padding:10px 22px;border-radius:999px;border:1px solid #c2113a;background:#c2113a;color:#fffaf3;font:500 10px/1 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer" onclick="location.reload()">Reload</button>'
        boot.style.flexDirection = 'column'
        boot.style.textAlign = 'center'
        boot.style.padding = '24px'
      }, 8000)
    </script>
  </body>
</html>
