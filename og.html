<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hibba is 19 — social card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=Caveat:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #fbf3e9; }
      .artboard {
        position: absolute;
        top: 60px;
        left: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(90% 80% at 12% 0%, #fffaf3 0%, rgba(255, 250, 243, 0) 60%),
          radial-gradient(70% 70% at 88% 92%, #ffd8c2 0%, rgba(255, 216, 194, 0) 62%),
          radial-gradient(60% 60% at 74% 18%, #ffc3d6 0%, rgba(255, 195, 214, 0) 70%),
          #fbf3e9;
        font-family: 'Space Grotesk', sans-serif;
        color: #2c1119;
      }
      .grid {
        position: absolute; inset: 0;
        background-image: linear-gradient(90deg, rgba(44,17,25,.06) 1px, transparent 1px);
        background-size: 100px 100%;
      }
      .frame {
        position: absolute; inset: 32px;
        border: 1px solid rgba(44,17,25,.12);
        border-radius: 20px;
      }
      .label {
        position: absolute; top: 58px; left: 64px; z-index: 3;
        display: flex; align-items: center; gap: 12px;
        font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: #c2113a;
      }
      .label::before { content: ''; width: 30px; height: 1px; background: #c2113a; opacity: .6; }
      .right {
        position: absolute; top: 58px; right: 64px; z-index: 3;
        font-size: 9px; letter-spacing: .24em; color: rgba(44,17,25,.55);
      }
      h1 {
        position: absolute; left: 52px; top: 120px;
        font-family: 'Instrument Serif', serif; font-weight: 400;
        font-size: 250px; line-height: .78; letter-spacing: -.055em;
        color: #2c1119;
      }
      h1 em { font-style: normal; color: #c2113a; }
      .nineteen {
        position: absolute; right: 118px; top: 96px;
        font-family: 'Instrument Serif', serif; font-style: italic;
        font-size: 300px; line-height: .8; letter-spacing: -.06em;
        background: linear-gradient(155deg, #ffe4ec 0%, #ff6e9c 40%, #c2113a 90%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 26px 34px rgba(90,16,39,.26));
      }
      .tag {
        position: absolute; left: 64px; bottom: 116px;
        display: inline-flex; align-items: center; gap: 10px;
        padding: 10px 16px; border-radius: 999px;
        border: 1px solid rgba(194,17,58,.3);
        background: rgba(255,250,243,.75);
        font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #c2113a;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #c2113a; }
      .bottom {
        position: absolute; left: 64px; right: 64px; bottom: 52px;
        display: flex; justify-content: space-between; align-items: flex-end;
        font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
        color: rgba(44,17,25,.55);
      }
      .bottom strong { color: #2c1119; font-weight: 500; letter-spacing: .18em; }
      .script {
        position: absolute; right: 96px; bottom: 118px;
        font-family: 'Caveat', cursive; font-size: 44px; color: #5a1027;
        transform: rotate(-4deg);
      }
      .cherry {
        position: absolute; right: 118px; bottom: 158px;
        width: 96px; height: 96px; border-radius: 50%;
        background: radial-gradient(circle at 32% 26%, #ff9d9d 0%, #e22f4f 42%, #8f0c2a 100%);
        box-shadow: inset -10px -14px 24px rgba(60,0,16,.35), 0 26px 34px -22px rgba(90,16,39,.7);
        transform: rotate(-6deg);
      }
      .cherry::after {
        content: ''; position: absolute; left: 54%; top: -34px;
        width: 30px; height: 40px; border-left: 3px solid #5a1027; border-top: 3px solid #5a1027;
        border-radius: 70% 0 0 0; transform: rotate(-8deg);
      }
      .bow {
        position: absolute; right: 262px; bottom: 236px; width: 92px; height: 52px;
        transform: rotate(-8deg);
      }
      .bow::before, .bow::after {
        content: ''; position: absolute; top: 0; width: 50px; height: 46px;
        border-radius: 70% 30% 55% 45% / 60% 55% 45% 40%;
        background: radial-gradient(120% 120% at 30% 20%, #ffc2d5, #ff6e9c 55%, #d63a67 100%);
        box-shadow: inset -5px -7px 12px rgba(150,10,50,.35), 0 16px 24px -16px rgba(90,16,39,.6);
      }
      .bow::before { left: 0; transform: rotate(-16deg); }
      .bow::after { right: 0; transform: rotate(16deg) scaleX(-1); }
      .bow i {
        position: absolute; left: 50%; top: 42%; width: 22px; height: 22px; border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 35% 30%, #ffd0de, #ef4c86 70%);
        box-shadow: 0 4px 10px rgba(90,16,39,.35);
      }
      .pearl {
        position: absolute; left: 500px; top: 486px; width: 54px; height: 54px; border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, #ffffff, #ffd8e4 55%, #e5a7b9 100%);
        box-shadow: inset -6px -8px 14px rgba(120,40,60,.3), 0 18px 24px -18px rgba(90,16,39,.6);
      }

    </style>
  </head>
  <body>
    <!-- Artboard sits 60px down so a 1200x630 capture can be cropped without browser chrome. -->
    <div class="artboard">
    <div class="grid"></div>
    <div class="frame"></div>
    <div class="label">The 19th birthday experience</div>
    <div class="right">Vol. 19 · One night only</div>

    <h1>H<em>IBBA</em></h1>
    <div class="nineteen">19</div>

    <div class="tag"><span class="dot"></span>19 years of being iconically Hibba</div>
    <div class="script">happy birthday, trouble.</div>

    <div class="cherry"></div>
    <div class="bow"><i></i></div>
    <div class="pearl"></div>

    <div class="bottom">
      <strong>The world is currently celebrating Hibba.</strong>
      <span>A playful digital universe</span>
    </div>
    </div>
  </body>
</html>
